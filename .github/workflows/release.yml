name: Release

# Every push to main is built into a single HTML file and published as a
# GitHub release tagged v1.0.<run number>.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Releases are published one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  APP_FILE: empirical-reliability.html

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      TAG: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: |
          npm run build
          cp dist/index.html "$APP_FILE"

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          Program wyznaczający empiryczne wskaźniki niezawodności.

          Pobierz plik \`$APP_FILE\` i otwórz go w przeglądarce. Program działa bez instalacji i bez dostępu do internetu.

          Zbudowano z commita $GITHUB_SHA.
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$APP_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Empiryczne wskaźniki niezawodności $TAG" \
            --notes-file notes.md \
            --latest
